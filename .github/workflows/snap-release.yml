name: Build & Release Desktop Snap

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-snap:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snapcraft
        run: |
          for attempt in 1 2 3; do
            if sudo snap install snapcraft --classic; then
              exit 0
            fi
            echo "snap install snapcraft failed (attempt $attempt), retrying in 5s..."
            sleep 5
          done
          exit 1

      - name: Build Snap with Snapcraft (destructive-mode on ubuntu-24.04)
        working-directory: desktop
        run: sudo snapcraft pack --destructive-mode

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-bread-bible-snap
          path: desktop/*.snap

      - name: Attach Snap to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/*.snap
