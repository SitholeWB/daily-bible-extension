name: daily-bread-bible
title: Daily Bread — Offline Bible & Study
base: core24
version: '1.0.1'
license: MIT
icon: snap/gui/daily-bread.png
summary: Offline Bible & Study Notes with isiZulu, KJV, 60 packs & cross-references
description: |
  Daily Bread is a fast, modern, offline-first Bible reading and study app
  built natively for Ubuntu and Linux.

  Features:
  - Bundled offline KJV and isiZulu (1959) with bilingual book names
  - 58 additional downloadable offline Bible packs across global & African languages
  - Parallel side-by-side translation comparison
  - 63,000+ Treasury of Scripture Knowledge (TSK) cross-references
  - Markdown study notes, verse bookmarks, curated topics, and JSON backups
  - Native Ubuntu Yaru Light & Dark theme support

grade: stable
confinement: strict

apps:
  daily-bread-bible:
    command: daily_bread
    desktop: gui/daily-bread.desktop
    extensions: [gnome]
    plugs:
      - network
      - home

parts:
  daily-bread-bible:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
