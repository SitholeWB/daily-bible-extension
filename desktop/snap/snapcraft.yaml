name: daily-bread-bible
title: Daily Bread — Offline Bible & Study
base: core24
version: '1.0.5'
license: MIT
icon: snap/gui/daily-bread.png
summary: Offline Bible & Study Notes — 60 translations, cross-refs & parallel view
description: |
  Daily Bread is a fast, modern, offline-first Bible reading and study app
  built natively for Ubuntu and Linux.

  Features:
  - Offline-first reading with 60 downloadable Bible translations across global
    and African languages (including KJV, WEB, BSB, MSB, Spanish, French,
    Portuguese, German, Swahili, isiZulu, and more)
  - Parallel side-by-side translation comparison
  - 63,000+ Treasury of Scripture Knowledge (TSK) cross-references with
    inline verse previews
  - Markdown study notes, verse bookmarks, curated topics, and JSON backups
  - Fast full-text search and direct verse reference lookup (e.g. John 3:16)
  - Native Ubuntu Yaru Light & Dark theme support

grade: stable
confinement: strict

apps:
  daily-bread-bible:
    command: daily_bread
    desktop: gui/daily-bread.desktop
    extensions: [gnome]
    plugs:
      - network
      - home

parts:
  daily-bread-bible:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    override-pull: |
      craftctl default
      rm -rf build .dart_tool linux/flutter/ephemeral
